buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Add allprojects section for repositories
allprojects {
    repositories {
        // React Native repositories
        google()
        mavenCentral()
        // Required for react-native-background-fetch
        maven {
            url "${project.rootDir}/../node_modules/react-native-background-fetch/android/libs"
        }
        maven { url "https://www.jitpack.io" }

    }

    
    // Simple property to indicate which store to use for react-native-iap
    ext.iapStore = "play"
}

apply plugin: "com.facebook.react.rootproject"
